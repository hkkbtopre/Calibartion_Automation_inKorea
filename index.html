<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>도시철도 정산 현황</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
/* 색 역할: 승차·하차(범주, 검증 통과 aqua·yellow), 과소·과대(발산, blue↔red, 가운데=회색), 상태 good */
:root{
  --plane:#f4f4f1;--surface:#fcfcfb;--raise:#f1f0ec;--ink:#0b0b0b;--ink2:#52514e;--mute:#898781;
  --grid:#e1e0d9;--axis:#c3c2b7;--ring:rgba(11,11,11,.08);--shadow:0 1px 2px rgba(11,11,11,.04),0 8px 24px rgba(11,11,11,.04);
  --s1:#1baf7a;--s2:#eda100;--neg:#2a78d6;--pos:#e34948;--mid:#c9c8c0;--good:#0ca30c;--goodtext:#006300;
  --negwash:rgba(42,120,214,.10);--poswash:rgba(227,73,72,.10);--band:rgba(12,163,12,.07);--line:#3a3935;
}
@media (prefers-color-scheme:dark){:root{
  --plane:#0d0d0d;--surface:#1a1a19;--raise:#232322;--ink:#f0efec;--ink2:#c3c2b7;--mute:#898781;
  --grid:#2c2c2a;--axis:#383835;--ring:rgba(255,255,255,.08);--shadow:none;
  --s1:#199e70;--s2:#c98500;--neg:#3987e5;--pos:#e66767;--mid:#55544f;--good:#0ca30c;--goodtext:#0ca30c;
  --negwash:rgba(57,135,229,.16);--poswash:rgba(230,103,103,.16);--band:rgba(12,163,12,.10);--line:#d8d7d0;
}}
*{box-sizing:border-box}
html{background:var(--plane)}
body{margin:0;color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Apple SD Gothic Neo","Segoe UI","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1480px;margin:0 auto;padding:28px 24px 40px}
@media (max-width:700px){.wrap{padding:18px 16px 32px}}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.eyebrow{font-size:12px;color:var(--mute);letter-spacing:.02em;margin-bottom:4px}
h1{font-size:26px;line-height:1.2;letter-spacing:-.03em;margin:0;font-weight:700}
.live{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2);background:var(--surface);border:1px solid var(--ring);border-radius:999px;padding:6px 12px 6px 10px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--good);position:relative}
.live i:after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--good);opacity:.35;animation:pulse 2s ease-out infinite}
.live.stale i{background:var(--mute)}.live.stale i:after{display:none}
@keyframes pulse{0%{transform:scale(.6);opacity:.5}100%{transform:scale(1.6);opacity:0}}
@media (prefers-reduced-motion:reduce){.live i:after{animation:none}}
main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
@media (max-width:1080px){main{grid-template-columns:minmax(0,1fr)}}
section{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--surface);border:1px solid var(--ring);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow);min-width:0}
@media (max-width:700px){.card{padding:16px}}
.rhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.rname{display:flex;align-items:baseline;gap:10px}
h2{font-size:22px;margin:0;letter-spacing:-.03em;font-weight:700}
.chip{font-size:12px;color:var(--ink2)}
.state{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2);background:var(--raise);border-radius:999px;padding:3px 10px}
.state b{width:6px;height:6px;border-radius:50%;background:var(--good)}
.state.bad b{background:var(--pos)}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{background:var(--raise);border-radius:12px;padding:14px 14px 12px}
.tile .lab{font-size:12px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.tile .lab i{width:10px;height:3px;border-radius:2px}
.tile .val{font-size:40px;font-weight:700;letter-spacing:-.04em;line-height:1.1;margin:4px 0 10px}
.tile .val small{font-size:16px;font-weight:600;color:var(--mute);letter-spacing:0;margin-left:2px}
.strip{display:flex;gap:2px}
.strip span{flex:1;height:10px;border-radius:2px;background:var(--mid);cursor:default}
.strip span.in{background:var(--mid)}
.strip span.neg{background:var(--neg)}.strip span.pos{background:var(--pos)}
.strip-ends{display:flex;justify-content:space-between;font-size:10px;color:var(--mute);margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--grid)}
.stats div{min-width:0}.stats span{display:block;font-size:12px;color:var(--mute)}.stats b{font-size:17px;font-weight:600;letter-spacing:-.02em;white-space:nowrap}
@media (max-width:520px){.tile .val{font-size:32px}}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.ch h3{font-size:14px;margin:0;font-weight:600;letter-spacing:-.01em}
.seg{display:inline-flex;background:var(--raise);border-radius:9px;padding:3px}
.seg button{border:0;background:none;color:var(--ink2);font:inherit;font-size:12px;font-weight:500;padding:5px 12px;border-radius:7px;cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.map{height:400px;border-radius:12px;overflow:hidden;background:var(--raise);isolation:isolate}
@media (max-width:700px){.map{height:320px}}
.leaflet-container{font:inherit;background:var(--raise)}
.leaflet-control-attribution{font-size:9px;background:rgba(255,255,255,.6)!important}
.leaflet-tooltip.lbl{background:var(--surface);border:1px solid var(--ring);box-shadow:0 1px 3px rgba(0,0,0,.12);border-radius:6px;font-size:11px;color:var(--ink);padding:2px 6px;white-space:nowrap}
.leaflet-tooltip.lbl b{font-weight:700}
.leaflet-tooltip.lbl:before{display:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--ink2);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:50%}.legend i.ln{width:14px;height:2px;border-radius:1px}
.legend i.ring{background:var(--surface);border:1.5px solid var(--ink2);width:8px;height:8px}
.legend + .legend{margin-top:6px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:22px}
@media (max-width:560px){.pair{grid-template-columns:1fr}}
.sub{font-size:12px;color:var(--ink2);margin:0 0 6px}
.plot{position:relative}
.plot svg{display:block;width:100%;overflow:visible}
.plot text{font-size:10px;fill:var(--mute);font-variant-numeric:tabular-nums}
.plot text.end{font-size:11px;font-weight:600;fill:var(--ink)}
.tip{position:fixed;z-index:1000;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--ring);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.14);padding:8px 10px;font-size:12px;line-height:1.45;opacity:0;transition:opacity .12s;min-width:120px}
.tip .t{color:var(--mute);font-size:11px;margin-bottom:2px}
.tip .r{display:flex;align-items:center;gap:6px}.tip .r i{width:12px;height:2px;border-radius:1px}.tip .r b{font-weight:700;min-width:32px}
details{border-top:1px solid var(--grid);margin-top:14px;padding-top:10px}
summary{cursor:pointer;font-size:12px;color:var(--ink2);list-style:none;display:flex;align-items:center;gap:6px}
summary::-webkit-details-marker{display:none}summary:before{content:"›";display:inline-block;transition:transform .15s;font-size:14px}
details[open] summary:before{transform:rotate(90deg)}
.tbl{overflow-x:auto;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
th,td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--grid);white-space:nowrap}
th{color:var(--mute);font-weight:500;font-size:11px}
td.n{text-align:left;font-weight:500}
td.e{font-weight:600}td.e.in{color:var(--goodtext)}td.e.neg{background:var(--negwash)}td.e.pos{background:var(--poswash)}
footer{margin-top:24px;font-size:11px;color:var(--mute);text-align:center}
.dim{opacity:.55;transition:opacity .2s}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><div class="eyebrow">EMME 도시철도 자동정산 · 허용범위 ±10%</div><h1>도시철도 정산 현황</h1></div>
  <div class="live" id="live"><i></i><span id="stamp">불러오는 중</span></div>
</header>
<main id="main"></main>
<footer>지도 © OpenStreetMap · Esri · 역 위치는 망 좌표 변환값(수백 m 오차 가능)</footer>
</div>
<div class="tip" id="tip"></div>
<script>
"use strict";
const 권역들 = ["대전", "광주"], 상태 = {}, 지도 = {};
let 최근 = null;
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const 수 = (v, d = 0) => Number(v).toLocaleString("ko-KR", {maximumFractionDigits: d, minimumFractionDigits: d});
const 부호 = (v, d = 1) => (v > 0 ? "+" : v < 0 ? "−" : "") + 수(Math.abs(v), d);
const 짧게 = v => v >= 1e6 ? 수(v / 1e6, 1) + "M" : v >= 1e3 ? 수(v / 1e3) + "K" : 수(v);
const 판정 = (e, 허용) => Math.abs(e) <= 허용 ? "in" : e > 0 ? "pos" : "neg";
const 판정색 = k => k === "in" ? css("--mid") : k === "pos" ? css("--pos") : css("--neg");
const el = (태그, 속성 = {}, 글 = "") => { const e = document.createElement(태그); Object.assign(e, 속성); if (글) e.textContent = 글; return e; };
const NS = "http://www.w3.org/2000/svg";
const svg = (태그, 속성 = {}) => { const e = document.createElementNS(NS, 태그); for (const k in 속성) e.setAttribute(k, 속성[k]); return e; };

/* 공용 툴팁: 값이 앞, 이름이 뒤. textContent 로만 채운다 */
const tip = document.getElementById("tip");
function 팁보이기(ev, 제목, 줄들) {
  tip.replaceChildren(el("div", {className: "t"}, 제목));
  줄들.forEach(([색, 값, 이름]) => { const r = el("div", {className: "r"}); const i = el("i"); i.style.background = 색; r.append(i, el("b", {}, 값), el("span", {}, 이름)); tip.append(r); });
  const x = Math.min(ev.clientX + 14, innerWidth - tip.offsetWidth - 8), y = Math.min(ev.clientY + 14, innerHeight - tip.offsetHeight - 8);
  tip.style.left = x + "px"; tip.style.top = y + "px"; tip.style.opacity = 1;
}
const 팁숨기기 = () => tip.style.opacity = 0;

function 뼈대() {
  const main = document.getElementById("main");
  권역들.forEach(r => {
    const s = el("section", {id: "s-" + r});
    s.innerHTML = `
    <div class="card">
      <div class="rhead"><div class="rname"><h2></h2><span class="chip" data-k="chip"></span></div><span class="state" data-k="state"><b></b><span></span></span></div>
      <div class="hero">
        <div class="tile"><div class="lab"><i style="background:var(--s1)"></i>승차 범위 안</div><div class="val" data-k="v승"></div><div class="strip" data-k="st승"></div><div class="strip-ends" data-k="se승"></div></div>
        <div class="tile"><div class="lab"><i style="background:var(--s2)"></i>하차 범위 안</div><div class="val" data-k="v하"></div><div class="strip" data-k="st하"></div><div class="strip-ends" data-k="se하"></div></div>
      </div>
      <div class="stats"><div><span>누적 배정</span><b data-k="누적"></b></div><div><span>손실</span><b data-k="손실"></b></div><div><span>최선해 갱신</span><b data-k="최선"></b></div></div>
    </div>
    <div class="card">
      <div class="ch"><h3>노선 지도</h3><span class="tools"><span class="seg" data-k="lay"><button class="on">커넥터</button></span><span class="seg" data-k="mode"><button class="on" data-m="승">승차</button><button data-m="하">하차</button></span></span></div>
      <div class="map" id="map-${r}"></div>
      <div class="legend"><span><i style="background:var(--mid)"></i>±10% 안</span><span><i style="background:var(--pos)"></i>과대 (+)</span><span><i style="background:var(--neg)"></i>과소 (−)</span><span>원 크기 = 오차 크기</span></div>
      <div class="legend" data-k="lg2"><span><i class="ring"></i>존 중심</span><span><i class="ln" style="background:var(--line)"></i>존 커넥터</span><span><i class="ln" data-k="lg930"></i><span data-k="lg930t"></span></span><span>진하고 굵을수록 가중치 낮음 = 더 이용</span></div>
    </div>
    <div class="card">
      <div class="ch"><h3>수렴 추이</h3><span class="chip">가로축 누적 배정</span></div>
      <div class="pair"><div><p class="sub">범위 안 역 수</p><div class="plot" data-k="cv1"></div></div><div><p class="sub">손실</p><div class="plot" data-k="cv2"></div></div></div>
      <div class="legend"><span><i class="ln" style="background:var(--s1)"></i>승차</span><span><i class="ln" style="background:var(--s2)"></i>하차</span><span><i class="ln" style="background:var(--ink)"></i>손실</span></div>
    </div>
    <div class="card">
      <div class="ch"><h3>역별 오차율</h3><span class="chip">노선 순서 · ±60% 밖은 끝에서 자름</span></div>
      <div class="plot" data-k="bars"></div>
      <div class="legend"><span><i style="background:var(--mid)"></i>±10% 안</span><span><i style="background:var(--pos)"></i>과대</span><span><i style="background:var(--neg)"></i>과소</span></div>
      <details><summary>역별 표</summary><div class="tbl"><table><thead><tr><th style="text-align:left">역</th><th>승차 실적</th><th>배정</th><th>오차%</th><th>하차 실적</th><th>배정</th><th>오차%</th></tr></thead><tbody data-k="tb"></tbody></table></div></details>
    </div>`;
    s.querySelector("h2").textContent = r;
    main.append(s);
    상태[r] = {모드: "승", 커넥터: true};
    const 모드단추 = s.querySelectorAll('[data-k="mode"] button');
    모드단추.forEach(b => b.onclick = () => {
      모드단추.forEach(x => x.classList.toggle("on", x === b));
      상태[r].모드 = b.dataset.m; 지도칠하기(r);
    });
    const 층단추 = s.querySelector('[data-k="lay"] button');
    층단추.onclick = () => { 상태[r].커넥터 = !상태[r].커넥터; 층단추.classList.toggle("on", 상태[r].커넥터); 지도칠하기(r); };
    if (window.L) {
      const m = L.map("map-" + r, {zoomControl: false, scrollWheelZoom: false, attributionControl: true});
      const 어두움 = matchMedia("(prefers-color-scheme: dark)").matches;
      L.tileLayer(`https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_${어두움 ? "Dark" : "Light"}_Gray_Base/MapServer/tile/{z}/{y}/{x}`,
        {maxZoom: 16, attribution: "Esri · OSM"}).addTo(m);
      L.control.zoom({position: "bottomright"}).addTo(m);
      m.attributionControl.setPrefix(false);
      // 커넥터·존 중심은 노선·역 아래 층에 캔버스로 그린다(수천 개)
      m.createPane("conn").style.zIndex = 380; m.createPane("zone").style.zIndex = 390;
      지도[r] = {m, 선: [], 점: [], 그림: L.canvas({pane: "conn", padding: .3}), 존그림: L.canvas({pane: "zone", padding: .3}), 층: null, 키: ""};
    }
  });
}

function 지도칠하기(r) {
  const d = 상태[r].자료, g = 지도[r], 허용 = 최근 && 최근.허용, 키 = 상태[r].모드;
  if (!d || !g) return;
  if (!g.선.length) {
    const 위치 = d.역.map(s => [s.위도, s.경도]);
    g.선.push(L.polyline(위치, {color: css("--surface"), weight: 9, opacity: 1}).addTo(g.m));
    g.선.push(L.polyline(위치, {color: css("--line"), weight: 4, opacity: .8, lineJoin: "round"}).addTo(g.m));
    g.m.fitBounds(g.선[0].getBounds(), {paddingTopLeft: [36, 36], paddingBottomRight: [110, 36]});  // 오른쪽은 역 이름표 자리
  }
  g.점.forEach(x => x.remove()); g.점 = [];
  // 범위 안 역을 먼저, 큰 오차를 나중에 그려 위로 올린다
  [...d.역].sort((a, b) => Math.abs(a[키]) - Math.abs(b[키])).forEach(s => {
    const e = s[키], k = 판정(e, 허용), 밖 = k !== "in";
    const 반지름 = 밖 ? 6 + Math.min(Math.abs(e), 60) / 60 * 10 : 5;
    const c = L.circleMarker([s.위도, s.경도], {radius: 반지름, color: css("--surface"), weight: 2, fillColor: 판정색(k), fillOpacity: 1}).addTo(g.m);
    const 글 = el("span"); 글.append(document.createTextNode(s.역 + " "), el("b", {}, 부호(e) + "%"));
    c.bindTooltip(글, {permanent: 밖, direction: "right", offset: [반지름 + 2, 0], className: "lbl"});
    const 팝 = el("div"); 팝.append(el("b", {}, s.역), el("br"),
      document.createTextNode(`승차 ${수(s.실승)} → ${수(s.배승)} (${부호(s.승)}%)`), el("br"),
      document.createTextNode(`하차 ${수(s.실하)} → ${수(s.배하)} (${부호(s.하)}%)`));
    c.bindPopup(팝);
    g.점.push(c);
  });
  커넥터칠하기(r);
}

/* 커넥터 가중치(@auxpf, 최선해). 시작값 대비 낮을수록(더 이용) 진하고 굵게: ×1/4 ~ ×4 를 0~1 로 */
let 커넥터망 = null;
const 세기 = (v, 시작) => Math.max(0, Math.min(1, (2 - Math.log2(v / 시작)) / 4));
const 값글 = v => 수(v, v < 1 ? 2 : 1);
function 팁글(제목, v, 시작) {
  const e = el("span"); e.append(document.createTextNode(제목 + " · 가중치 "), el("b", {}, 값글(v)), document.createTextNode(` (시작 ${수(시작, 1)})`));
  return e;
}
function 커넥터칠하기(r) {
  const g = 지도[r], d = 상태[r].자료, 망 = 커넥터망 && 커넥터망[r], 값 = d && d.커넥터, 키 = 상태[r].모드;
  const s = document.getElementById("s-" + r), 승차 = 키 === "승", 역색 = css(승차 ? "--s1" : "--s2");
  s.querySelector('[data-k="lg930"]').style.background = 역색;
  s.querySelector('[data-k="lg930t"]').textContent = 승차 ? "승차 커넥터" : "하차 커넥터";
  s.querySelector('[data-k="lg2"]').classList.toggle("dim", !상태[r].커넥터);
  s.querySelector('[data-k="lg2"]').style.display = s.querySelector('[data-k="lay"]').style.display = 망 && 값 ? "" : "none";
  const 열쇠 = [상태[r].커넥터, 키, d && d.최선시각, !!망, !!값].join("|");
  if (!g || g.키 === 열쇠) return;
  g.키 = 열쇠;
