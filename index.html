<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>도시철도 정산 현황</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#16181d;--mut:#6b7280;--line:#e6e8ec;--soft:#f0f2f5;
--on:#2563eb;--off:#ea7a1a;--ok:#16a34a;--okbg:#e8f6ec;--neg:#2563eb;--pos:#dc2626;--band:rgba(22,163,74,.10)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#171a20;--fg:#eceef2;--mut:#9aa1ad;--line:#272b33;--soft:#1e222a;
--on:#6b9cff;--off:#ff9d4d;--ok:#3ccf74;--okbg:#16301f;--neg:#6b9cff;--pos:#ff6b6b;--band:rgba(60,207,116,.13)}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
header{max-width:1440px;margin:0 auto;padding:20px 20px 6px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:20px;letter-spacing:-.02em;margin:0}
.stamp{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--okbg)}
.dot.stale{background:var(--mut);box-shadow:none}
main{max-width:1440px;margin:0 auto;padding:10px 20px 32px;display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:980px){main{grid-template-columns:1fr;padding:10px 16px 28px}header{padding:16px 16px 4px}}
section{min-width:0;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.title{display:flex;align-items:baseline;justify-content:space-between}
h2{font-size:18px;margin:0;letter-spacing:-.02em}
.sub{font-size:12px;color:var(--mut)}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.kpi div{background:var(--soft);border-radius:10px;padding:10px 12px}
.kpi b{display:block;font-size:24px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.2}
.kpi b small{font-size:13px;color:var(--mut);font-weight:500}
.kpi span{font-size:12px;color:var(--mut)}
.kpi .bar{height:4px;border-radius:2px;background:var(--line);margin-top:6px;overflow:hidden;padding:0}.kpi .bar i{display:block;height:100%;background:var(--ok)}
@media (max-width:520px){.kpi{grid-template-columns:repeat(2,1fr)}}
.h3{font-size:13px;font-weight:600;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.seg{display:inline-flex;background:var(--soft);border-radius:8px;padding:2px}
.seg button{border:0;background:none;color:var(--mut);font:inherit;font-size:12px;padding:4px 10px;border-radius:6px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.map{height:380px;border-radius:10px;overflow:hidden;background:var(--soft)}
.leaflet-container{font:inherit;background:var(--soft)}
.leaflet-tooltip.lbl{background:transparent;border:0;box-shadow:none;font-size:11px;font-weight:600;color:var(--fg);padding:0;white-space:nowrap;text-shadow:0 0 3px var(--card),0 0 3px var(--card),0 0 3px var(--card)}
.leaflet-tooltip.lbl:before{display:none}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--mut);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.cv{display:grid;grid-template-columns:28px 1fr;gap:4px 6px}
.yl{display:flex;flex-direction:column;justify-content:space-between;font-size:10px;color:var(--mut);text-align:right;height:120px}
.xl{position:relative;height:16px;font-size:10px;color:var(--mut)}
.cv .xl{grid-column:2}
.xl span{position:absolute;transform:translateX(-50%)}.xl span:first-child{transform:none}.xl span:last-child{transform:translateX(-100%)}
svg{display:block;overflow:visible}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media (max-width:520px){.two{grid-template-columns:1fr}}
.rows{display:grid;grid-template-columns:auto 1fr;column-gap:8px}
.rows .n{font-size:12px;text-align:right;white-space:nowrap;height:24px;line-height:24px}
table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
th,td{padding:6px;text-align:right;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:500;font-size:11px}thead tr:first-child th{border-bottom:0;padding-bottom:0}
td.n{text-align:left;white-space:nowrap;font-weight:500}
td.e{font-weight:600}td.ok{color:var(--ok)}td.pos{color:var(--pos)}td.neg{color:var(--neg)}
.scroll{overflow-x:auto}
</style>
</head>
<body>
<header><h1>도시철도 정산 현황</h1><div class="stamp"><span class="dot" id="dot"></span><span id="stamp">불러오는 중</span></div></header>
<main id="main"></main>
<script>
const 권역들 = ["대전", "광주"], 상태 = {}, 지도 = {};
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const 수 = (v, d = 0) => Number(v).toLocaleString("ko-KR", {maximumFractionDigits: d, minimumFractionDigits: d});
const 부호 = v => (v > 0 ? "+" : "") + 수(v, 1);
const 색 = (e, 허용) => Math.abs(e) <= 허용 ? css("--ok") : (e > 0 ? css("--pos") : css("--neg"));

function 뼈대() {
  document.getElementById("main").innerHTML = 권역들.map(r => `
  <section id="s-${r}">
    <div class="card"><div class="title"><h2>${r}</h2><span class="sub" data-k="sub"></span></div><div class="kpi" data-k="kpi"></div></div>
    <div class="card"><div class="h3"><span>노선 지도 · 역별 오차율</span><span class="seg"><button class="on" data-m="승">승차</button><button data-m="하">하차</button></span></div>
      <div class="map" id="map-${r}"></div>
      <div class="legend"><span><i style="background:var(--ok)"></i>±10% 안</span><span><i style="background:var(--pos)"></i>과대(+)</span><span><i style="background:var(--neg)"></i>과소(−)</span><span>원이 클수록 오차가 큼 · 범위 밖 역만 이름 표시</span></div></div>
    <div class="card"><div class="two">
      <div><div class="h3">범위 안 역 수</div><div data-k="cv1"></div></div>
      <div><div class="h3">손실</div><div data-k="cv2"></div></div></div>
      <div class="legend"><span><i style="background:var(--on)"></i>승차</span><span><i style="background:var(--off)"></i>하차</span><span>가로축: 누적 배정 횟수</span></div></div>
    <div class="card"><div class="h3">역별 오차율 (%)</div><div data-k="bars"></div>
      <div class="legend"><span><i style="background:var(--on)"></i>승차</span><span><i style="background:var(--off)"></i>하차</span><span>초록 띠 ±10% · ±60% 밖은 끝에서 자름</span></div></div>
    <div class="card scroll"><table><thead><tr><th></th><th colspan="3" style="text-align:center">승차</th><th colspan="3" style="text-align:center">하차</th></tr>
      <tr><th style="text-align:left">역</th><th>실적</th><th>배정</th><th>오차%</th><th>실적</th><th>배정</th><th>오차%</th></tr></thead><tbody data-k="tb"></tbody></table></div>
  </section>`).join("");
  const 어두움 = matchMedia("(prefers-color-scheme: dark)").matches;
  권역들.forEach(r => {
    상태[r] = {모드: "승"};
    const s = document.getElementById("s-" + r);
    s.querySelectorAll(".seg button").forEach(b => b.onclick = () => {
      s.querySelectorAll(".seg button").forEach(x => x.classList.toggle("on", x === b));
      상태[r].모드 = b.dataset.m; 지도칠하기(r);
    });
    if (!window.L) return;
    const m = L.map("map-" + r, {zoomControl: false, scrollWheelZoom: false});
    L.tileLayer(`https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_${어두움 ? "Dark" : "Light"}_Gray_Base/MapServer/tile/{z}/{y}/{x}`,
      {maxZoom: 16, attribution: "Esri, HERE, Garmin, © OpenStreetMap"}).addTo(m);
    L.control.zoom({position: "bottomright"}).addTo(m);
    지도[r] = {m, 선: null, 점: []};
  });
}

function 지도칠하기(r) {
  const d = 상태[r].자료, g = 지도[r], 허용 = 상태.허용, 키 = 상태[r].모드;
  if (!d || !g) return;
  if (!g.선) {
    g.선 = L.polyline(d.역.map(s => [s.위도, s.경도]), {color: css("--mut"), weight: 4, opacity: .45}).addTo(g.m);
    g.m.fitBounds(g.선.getBounds(), {padding: [28, 28]});
  }
  g.점.forEach(x => x.remove()); g.점 = [];
  d.역.forEach(s => {
    const e = s[키], 반지름 = 6 + Math.min(Math.abs(e), 60) / 60 * 12;
    const c = L.circleMarker([s.위도, s.경도], {radius: 반지름, color: css("--card"), weight: 1.5, fillColor: 색(e, 허용), fillOpacity: .9}).addTo(g.m);
    // 범위 밖 역만 이름을 늘 띄우고, 범위 안 역은 손가락/마우스를 올리면 보인다(겹침 방지)
    c.bindTooltip(`${s.역} ${부호(e)}%`, {permanent: Math.abs(e) > 허용, direction: "right", offset: [반지름, 0], className: "lbl"});
    c.bindPopup(`<b>${s.역}</b><br>승차 ${수(s.실승)} → ${수(s.배승)} (${부호(s.승)}%)<br>하차 ${수(s.실하)} → ${수(s.배하)} (${부호(s.하)}%)`);
    g.점.push(c);
  });
}

function 선그래프(점들, 값들, 최대, 눈금) {
  const x끝 = 점들[점들.length - 1][0] || 1, H = 120;
  const 경로 = f => {
    let p = "", 앞 = null;
    점들.forEach(q => { const x = q[0] / x끝 * 100, y = H - f(q) / 최대 * H; p += 앞 === null ? `M${x},${y}` : `L${x},${앞}L${x},${y}`; 앞 = y; });
    return p;
  };
  const 선 = 값들.map(([f, c]) => `<path d="${경로(f)}" fill="none" stroke="${c}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>`).join("");
  const 격자 = [0, .5, 1].map(t => `<line x1="0" x2="100" y1="${t * H}" y2="${t * H}" stroke="${css("--line")}" vector-effect="non-scaling-stroke"/>`).join("");
  const 가로 = [0, .25, .5, .75, 1].map(t => `<span style="left:${t * 100}%">${수(x끝 * t / 1000)}k</span>`).join("");
  return `<div class="cv"><div class="yl">${눈금.map(v => `<span>${v}</span>`).join("")}</div><svg viewBox="0 0 100 ${H}" preserveAspectRatio="none" width="100%" height="${H}">${격자}${선}</svg><div class="xl">${가로}</div></div>`;
}

function 막대그래프(역들, 허용) {
  const 축 = 60, 줄 = 24, H = 역들.length * 줄, 띠 = 허용 / 축 * 50;
  const 막 = (v, c, y) => { const w = Math.max(-축, Math.min(축, v)) / 축 * 50; return `<rect x="${w >= 0 ? 50 : 50 + w}%" y="${y}" width="${Math.abs(w)}%" height="7" rx="2" fill="${c}"/>`; };
  const 몸 = 역들.map((s, k) => 막(s.승, css("--on"), k * 줄 + 4) + 막(s.하, css("--off"), k * 줄 + 13)).join("");
  const 가로 = [-60, -30, 0, 30, 60].map(v => `<span style="left:${(v + 축) / 축 / 2 * 100}%">${v > 0 ? "+" : ""}${v}%</span>`).join("");
  return `<div class="rows"><div>${역들.map(s => `<div class="n">${s.역}</div>`).join("")}</div>
    <div><svg width="100%" height="${H}"><rect x="${50 - 띠}%" y="0" width="${2 * 띠}%" height="${H}" fill="${css("--band")}"/>
    <line x1="50%" x2="50%" y1="0" y2="${H}" stroke="${css("--mut")}" stroke-width="1"/>${몸}</svg><div class="xl">${가로}</div></div></div>`;
}

const 칸 = (v, 허용) => `<td class="e ${Math.abs(v) <= 허용 ? "ok" : v > 0 ? "pos" : "neg"}">${부호(v)}</td>`;

function 그리기(자료) {
  상태.허용 = 자료.허용;
  권역들.forEach(r => {
    const d = 자료.권역[r], s = document.getElementById("s-" + r), n = d.역.length, 허용 = 자료.허용;
    상태[r].자료 = d;
    const 승안 = d.역.filter(x => Math.abs(x.승) <= 허용).length, 하안 = d.역.filter(x => Math.abs(x.하) <= 허용).length;
    const 카드 = (v, 라벨, 비) => `<div><b>${v}</b><span>${라벨}</span>${비 == null ? "" : `<div class="bar"><i style="width:${비 * 100}%"></i></div>`}</div>`;
    s.querySelector('[data-k="kpi"]').innerHTML = 카드(`${승안}<small> / ${n}</small>`, "승차 범위 안", 승안 / n)
      + 카드(`${하안}<small> / ${n}</small>`, "하차 범위 안", 하안 / n) + 카드(수(d.누적), "누적 배정") + 카드(수(d.손실, 2), "손실");
    s.querySelector('[data-k="sub"]').textContent = (d.시각 || "").slice(5, 16) + " 최신 배정";
    const 점 = d.점, 최대손실 = Math.max(...점.map(p => p[1]));
    s.querySelector('[data-k="cv1"]').innerHTML = 선그래프(점, [[p => n - p[2], css("--on")], [p => n - p[3], css("--off")]], n, [n, Math.round(n / 2), 0]);
    s.querySelector('[data-k="cv2"]').innerHTML = 선그래프(점, [[p => p[1], css("--fg")]], 최대손실, [Math.round(최대손실), Math.round(최대손실 / 2), 0]);
    s.querySelector('[data-k="bars"]').innerHTML = 막대그래프(d.역, 허용);
    s.querySelector('[data-k="tb"]').innerHTML = d.역.map(x => `<tr><td class="n">${x.역}</td><td>${수(x.실승)}</td><td>${수(x.배승)}</td>${칸(x.승, 허용)}<td>${수(x.실하)}</td><td>${수(x.배하)}</td>${칸(x.하, 허용)}</tr>`).join("");
    지도칠하기(r);
  });
  const 지남 = (Date.now() - new Date(자료.만든때.replace(" ", "T")).getTime()) / 60000;
  document.getElementById("stamp").textContent = 자료.만든때.slice(0, 16) + " 기준" + (지남 > 20 ? ` · ${Math.round(지남)}분 전` : "");
  document.getElementById("dot").classList.toggle("stale", 지남 > 20);
}

async function 읽기() {
  try { const r = await fetch("data.json?t=" + Date.now(), {cache: "no-store"}); if (r.ok) 그리기(await r.json()); } catch (e) {}
}
뼈대(); 읽기(); setInterval(읽기, 10000);
</script>
</body>
</html>
