  const b=svg.getBoundingClientRect(),x=(ev.clientX-b.left)/b.width*W,v=(x-L)/(W-L-R)*xmax;
  let k=0;for(let i=0;i<p.length;i++){if(p[i][0]<=v)k=i}
  const sx=L+(W-L-R)*v/xmax;cx.setAttribute('x1',sx);cx.setAttribute('x2',sx);cx.setAttribute('visibility','visible');
  tip.innerHTML=`<b>${r.권역}</b> · 누적 ${f(Math.round(v))}배정<br>`+opt.series.map(o=>`<span style="color:var(${o.c})">●</span> ${o.n} ${f(p[k][o.i],opt.dec)}`).join('<br>');
  tip.style.display='block';tip.style.left=Math.min(ev.clientX+12,innerWidth-200)+'px';tip.style.top=(ev.clientY+12)+'px'});
 svg.querySelector('.hit').addEventListener('mouseleave',()=>{tip.style.display='none';cx.setAttribute('visibility','hidden')});
}
function eCell(v){const a=Math.min(Math.abs(v)/60,1),ok=Math.abs(v)<=10;
 const bg=ok?'var(--mid)':`color-mix(in srgb, var(${v<0?'--neg':'--pos'}) ${Math.round(18+50*a)}%, var(--surface))`;
 return `<td><span class="e" style="background:${bg}">${v>0?'+':''}${f(v,1)}%${ok?' ✓':''}</span></td>`}
const g=document.getElementById('g');
D.권역들.forEach(r=>{
 const h=r.현황,o=r.출발,st=r.상태;
 const dl=(now,from,dec,unit='')=>from==null||now==null?'':`<div class="d">10/5 ${f(from,dec)}${unit}에서 ${now<from?'▼':now>from?'▲':'＝'}${f(Math.abs(now-from),dec)}</div>`;
 const c=document.createElement('section');c.className='card';
 c.innerHTML=`<div class="head"><h2>${r.권역} <span style="font-weight:400;color:var(--muted);font-size:13px">${r.역수}개 역</span></h2>
 <span class="chip"><b style="background:var(--${st.등급})"></b>${st.표시}${st.실행?' · '+st.실행:''}</span></div>
 <div class="stats"><div class="stat"><div class="l">최선 손실</div><div class="v">${f(h.최적손실,2)}</div>${dl(h.최적손실,o&&o[1],2)}</div>
 <div class="stat"><div class="l">승차 밖 역</div><div class="v">${f(h.승차밖)}<span style="font-size:13px;color:var(--muted)">/${r.역수}</span></div>${dl(h.승차밖,o&&o[2],0)}</div>
 <div class="stat"><div class="l">하차 밖 역</div><div class="v">${f(h.하차밖)}<span style="font-size:13px;color:var(--muted)">/${r.역수}</span></div>${dl(h.하차밖,o&&o[3],0)}</div>
 <div class="stat"><div class="l">총량비 승/하</div><div class="v" style="font-size:18px">${f(h.총량비승,2)} / ${f(h.총량비하,2)}</div><div class="d">이번 실행 ${f(h.배정수)}배정</div></div></div>
 <div class="ct">최선 손실 <span>· 10/5 실행부터 누적 배정</span></div><div class="c1"></div>
 <div class="ct"><span>점선 = 실행 구간 경계: ${r.구간.map((g,k)=>`${g.이름} (${f(g.x)}~${f(k+1<r.구간.length?r.구간[k+1].x:Math.max(...r.점.map(q=>q[0])))})`).join(' → ')}</span></div>
 <div class="ct">허용범위 밖 역 수</div><div class="lg"><span><i style="background:var(--s1)"></i>승차</span><span><i style="background:var(--s2)"></i>하차</span></div><div class="c2"></div>
 <details><summary>역별 오차 보기 (오차 큰 순)</summary><div class="tw"><table><thead><tr><th>역</th><th>실적승차</th><th>배정승차</th><th>승차오차</th><th>실적하차</th><th>배정하차</th><th>하차오차</th></tr></thead>
 <tbody>${r.역.map(e=>`<tr><td>${e[0]}</td><td>${f(e[1])}</td><td>${f(e[2])}</td>${eCell(e[3])}<td>${f(e[4])}</td><td>${f(e[5])}</td>${eCell(e[6])}</tr>`).join('')}</tbody></table></div></details>`;
 const o1={h:150,label:'최선 손실',dec:2,series:[{i:1,n:'손실',c:'--s1'}]};
 const o2={h:120,label:'허용범위 밖 역 수',dec:0,zero:true,series:[{i:2,n:'승차 밖',c:'--s1'},{i:3,n:'하차 밖',c:'--s2'}]};
 c.querySelector('.c1').innerHTML=chart(r,0,o1);c.querySelector('.c2').innerHTML=chart(r,0,o2);
 g.appendChild(c);
 const s1=c.querySelector('.c1 svg'),s2=c.querySelector('.c2 svg');if(s1)hover(s1,r,o1);if(s2)hover(s2,r,o2);
});
</script></body></html>
